# tipografico (stile delle intestazioni) -> PascalCase, come nell'xlsx; le classi associative di
# convenzione seguono (IngredientDish, DishMeal). Attributi invariati (categoria a grafia mista:
# Name/Unit/Stock accanto a NAME/STARTTIME). plantuml.txt resta fedele all'immagine.

