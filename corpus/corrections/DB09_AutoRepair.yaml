# Test set De Bari, es. 9 Auto Repair (2026-10-03, decisione utente: eccezione 'maiuscolo tipografico').
# Il diagramma (scritto a mano) e' interamente in maiuscolo: il maiuscolo e' tipografico, non informativo.
# plantuml.txt resta fedele all'immagine; qui: classi -> PascalCase (confini di parola da Analysis.xlsx:
# Part/Acc, Car Model, Part Type), attributi -> minuscolo con i separatori come scritti. Acronimi
# riconosciuti invariati (ID, SSN, VAT, NIN, TIN, SMS, DVD, VHS, ASCII): qui solo ID.

