# Classificazione delle etichette delle relazioni (associazione, ruolo, ruolo_doppio, vincolo, qualificatore,
# dubbio): DATI approvati dall'utente, letti da corpus/generate_label_classification.py, che genera
# label_classification.json (letto dal convertitore) e label_classification.md. Spostati qui dal dizionario
# CLASSIFICATION del generatore il 2026-10-10 (voce 116), stesso contenuto e stesso ordine.
# Chiave: esercizio, sorgente, operatore, destinazione, etichetta (come nel PlantUML). estremo: null, il nome di una
# classe o 'source' / 'target', {estremo, testo} per un ruolo con testo diverso dall'etichetta, lista per
# ruolo_doppio. Nuove voci solo dopo la conferma dell'utente.

