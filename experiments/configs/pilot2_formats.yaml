# SECONDO PILOTA (2026-10-07): strada 1 PlantUML (convertito in Apollon dal convertitore della tesi) contro strada 2
# Apollon JSON con generazione vincolata allo schema. Esperimento PRELIMINARE, solo CORPUS (split corpus, selezione
# leave-one-out), MAI il test set. Regola di decisione registrata PRIMA della run: docs/decisions.md, voce 78.
# Una configurazione per volta (un modello caricato alla volta in LM Studio):
#   python experiments/run_experiment.py experiments/configs/pilot2_formats.yaml --configuration P-G
# Totale: 4 configurazioni x 6 esercizi x 2 ripetizioni = 48 generazioni, piu' la configurazione di RIFERIMENTO J0-Q
# (12 generazioni, solo descrittiva, FUORI dalla regola della voce 78: voce 83).
run_id: pilot2_formats
split: corpus
query_ids:   # gli stessi 6 esercizi del primo pilota (selezione della voce 75)
  - Louvre
  - Sober
  - StudentAppointment
  - CardGameApp
  - ApartmentBuilding
  - FilmSet
conditions: [bm25]
k: [2]
repetitions: 2
seed: 0
stop_on_reasoning: true
prompt: {serialization: compact, layout: user_only, drop_interactive: true}
generation:
  temperature: 0.3          # valore di lavoro, NON la decisione finale sulla temperatura
  top_p: 0.95               # IDENTICI per i due modelli (valori raccomandati da Gemma 4); NON sono i valori
  top_k: 64                 #   raccomandati da Qwen2.5-Coder (temperature 0.7, top_p 0.8, top_k 20, rep. penalty 1.05)
  max_tokens: 12288
  seed: 42
plantuml_label_rule: auto_v1   # regola automatica delle etichette (generation/plantuml_postprocess.py), approvata
                                #   allo STOP 1 del secondo pilota (voce 79)
models:
  G:
    client:
      kind: lmstudio
      base_url: http://localhost:1234/v1
      model: google/gemma-4-12b-qat
      timeout_s: 1200
      retries: 3
      backoff_s: 2.0
      unsupported_params: []
    model_metadata:
      model_id: google/gemma-4-12b-qat
      quantization: QAT (q4_0)
      context_length: 32768
      lmstudio_version: 0.4.25+1
      enable_thinking: false
      kv_cache_quant: F16            # K e V F16 (non quantizzata), come nel primo pilota (voce 87)
      flash_attention: true          # come nel primo pilota (voce 87)
      hardware:
        cpu: AMD Ryzen 7 7800X3D 8-Core Processor (8 core, 16 thread)
        gpu: NVIDIA GeForce RTX 4070 12 GB
        ram_gb: 32
        vram_gb: 12
        vram_used: "9,9 GB dedicata + 0,2 GB condivisa con contesto 32768, modello interamente in VRAM (smoke test 2026-10-06)"
  Q:                                 # Qwen2.5-Coder 7B Instruct Q6_K (dal 2026-10-07 sera; prima 14B, voce 84)
    client:
      kind: lmstudio
      base_url: http://localhost:1234/v1
      model: qwen2.5-coder-7b-instruct   # id LM Studio (smoke test del 2026-10-07, voce 86); senza editore
      timeout_s: 1200
      retries: 3
      backoff_s: 2.0
      unsupported_params: []
    model_metadata:                  # experiments/configs/qwen25coder7b_template.yaml (voce 85; il 14B non entra
                                     #   in VRAM a 32768, voce 84)
      model_id: qwen2.5-coder-7b-instruct   # l'id esposto da LM Studio non contiene l'editore: la fonte
                                            #   (lmstudio-community, Q6_K) e' nel campo source (voce 86)
      quantization: Q6_K
      source: lmstudio-community/Qwen2.5-Coder-7B-Instruct-GGUF   # confermata dall'utente in My Models (voce 86)
      context_length: 32768
      lmstudio_version: 0.4.25+1
      enable_thinking: false         # il modello NON ha una modalita' di ragionamento
      kv_cache_quant: F16            # nessuna quantizzazione della KV cache
      flash_attention: true
      hardware:
        cpu: AMD Ryzen 7 7800X3D 8-Core Processor (8 core, 16 thread)
        gpu: NVIDIA GeForce RTX 4070 12 GB
        ram_gb: 32
        vram_gb: 12
configurations:
  P-G: {model: G, output_format: plantuml}
  P-Q: {model: Q, output_format: plantuml}
  J-G: {model: G, output_format: apollon, structured_output: true,
        response_schema: generation/schemas/apollon_v4_generation.schema.json}
  J-Q: {model: Q, output_format: apollon, structured_output: true,
        response_schema: generation/schemas/apollon_v4_generation.schema.json}
  # RIFERIMENTO (voce 83): Qwen in Apollon JSON LIBERO (senza response_format), equivalente per Qwen di Gemma in JSON
  # libero a temperature 0.3 del primo pilota (stesso prompt byte per byte). Solo descrittiva: NON entra nella regola
  # della voce 78; completa il 2x2 della strada JSON (Gemma / Qwen x libero / vincolato).
  J0-Q: {model: Q, output_format: apollon}
