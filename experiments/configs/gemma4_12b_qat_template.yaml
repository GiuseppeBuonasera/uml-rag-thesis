# MODELLO per Gemma 4 12B QAT in LM Studio (lmstudio.ai/models/google/gemma-4-12b-qat), modello scelto per lo smoke
# test e il pilota (2026-10-06). Run reali BLOCCATE finche' il Passo 3b non e' sbloccato. I TODO fanno rifiutare la
# partenza al runner. Licenza: vedi docs/STATUS.md, "Modelli".
# Default del modello in LM Studio (NON usati: il runner invia tutti i parametri in modo esplicito): temperature 1,
# top_k 64, top_p 0.95, repeat penalty 1. Ragionamento attivo di default ("Enable Thinking" = true), marcatori
# <|channel>thought ... <channel|> (rimossi dal post-processing) o campo reasoning_content separato.
run_id: TODO_gemma4-12b-qat_data
split: testset
conditions: [zero_shot, static, random, bm25]
k: [3]
repetitions: 1
seed: 0
prompt: {serialization: compact, layout: user_only, drop_interactive: true}
client:
  kind: lmstudio
  base_url: http://localhost:1234/v1
  model: google/gemma-4-12b-qat   # id esposto da LM Studio (usato negli smoke test del 2026-10-06)
  timeout_s: 1200
  retries: 3
  backoff_s: 2.0
  unsupported_params: []
generation:
  temperature: TODO        # da decidere (domanda 8)
  top_p: TODO
  top_k: TODO
  max_tokens: 12288        # deciso allo STOP 1 del pilota (voce 75): identico per tutte le condizioni, tutti i k e
                           # tutte le run di questo modello; e' un tetto, non riserva contesto
  seed: 42
  structured_output: false
model_metadata:
  model_id: google/gemma-4-12b-qat   # pagina del modello in LM Studio
  quantization: QAT (q4_0)           # file GGUF lmstudio-community/gemma-4-12B-it-QAT-GGUF, Q4_0
  context_length: 32768              # usato nel secondo smoke test (k=3: solo 32k e' sicura, domanda 8)
  lmstudio_version: 0.4.25+1         # rilevata dall'installazione ("LM Studio.exe", ProductVersion 0.4.25.0);
                                     # `lms version` riporta solo il commit della CLI (69d945a)
  enable_thinking: false             # spento nelle impostazioni del modello (default del modello: true); domanda 15
  kv_cache_quant: TODO               # quantizzazione della KV cache con cui e' stato caricato nel primo pilota (da
                                     # chiedere all'utente; es. F16 se non quantizzata)
  flash_attention: TODO              # true / false come nel primo pilota (da chiedere all'utente)
  hardware:
    cpu: AMD Ryzen 7 7800X3D 8-Core Processor (8 core, 16 thread)   # rilevata dal sistema (Win32_Processor)
    gpu: NVIDIA GeForce RTX 4070 12 GB
    ram_gb: 32                       # rilevata dal sistema (32 GB di moduli, Win32_PhysicalMemory) e confermata
                                     # dalla memoria GPU condivisa di Windows (15,6 GB, circa meta' della RAM)
    vram_gb: 12
    vram_used: "9,9 GB dedicata + 0,2 GB condivisa con contesto 32768, modello interamente in VRAM (smoke test 2026-10-06)"
