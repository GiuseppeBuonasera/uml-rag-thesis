# CONTROLLO DI FUNZIONAMENTO DEI RETRIEVER + RUN ORACOLO (2026-10-09, voce 109, PROPOSTA): insieme di sviluppo (20
# esercizi del corpus, voce 92, leave-one-out), MAI il test set. Solo Gemma 4 12B QAT (voce 95), versione di
# configurazione 2, k = 3, formati PlantUML e JSON compatto, prompt SENZA blocco di istruzioni mirate (voce 100).
# Condizioni (il tipo di retriever e' un FATTORE sperimentale del Passo 3b, non un parametro da tarare):
#   dense      all-MiniLM-L6-v2 @ 1110a243 (retrieval/config_dense.yaml, esito della voce 108), il piu' simile per ultimo;
#   hybrid     RRF (c = 60) tra BM25 congelato (rifittato senza la query) e MiniLM, il piu' simile per ultimo;
#   oracle_jt  SOLO DIAGNOSTICA, MAI nel 3b: i k esempi con Jt massimo rispetto al GT della query (pareggi per id).
# Baseline = run di Gemma a k = 3 di dev_k.yaml (bm25, stessi parametri ed esercizi): i prompt devono differire SOLO
# negli esempi recuperati. Regola di esclusione e interpretazione dell'oracolo registrate PRIMA delle run (voce 109).
#   python experiments/run_experiment.py experiments/configs/dev_retrievers.yaml --configuration P-G [--resume]
# Totale: 3 condizioni x 2 formati x 20 esercizi x 2 ripetizioni = 240 generazioni (120 per configurazione).
run_id: dev_retrievers
config_version: 2           # contesto 32768, max_tokens 4096 (voce 93), come la baseline dev_k
split: corpus
query_ids:   # insieme di sviluppo della voce 92, identico a dev_k.yaml
  - Boeing
  - OilWells
  - Restaurant
  - EUScienceConnect
  - HomeForTheElderly
  - HelpingHands
  - Bookmaker
  - BusTransportationManagementSystem
  - FitnessCompanyConan
  - Facepage
  - Musicmatic
  - AlphaInsurance
  - ClothingCompany
  - PizzaDeliveryWithEntertainment
  - ProjectManagement
  - HospitalHouseMD
  - InsuranceCompany
  - TruckLogistics
  - Ebike
  - eHome2020
conditions: [dense, hybrid, oracle_jt]
k: [3]
repetitions: 2
seed: 0
stop_on_reasoning: true
prompt: {serialization: compact, layout: user_only, drop_interactive: true}  # niente blocco mirato
generation:
  temperature: 0.3
  top_p: 0.95
  top_k: 64
  max_tokens: 4096
  seed: 42
plantuml_label_rule: auto_v1
models:
  G:
    client:
      kind: lmstudio
      base_url: http://localhost:1234/v1
      model: google/gemma-4-12b-qat
      timeout_s: 1200
      retries: 3
      backoff_s: 2.0
      unsupported_params: []
    model_metadata:
      model_id: google/gemma-4-12b-qat
      quantization: QAT (q4_0)
      context_length: 32768
      lmstudio_version: 0.4.25+1
      enable_thinking: false
      kv_cache_quant: F16            # K e V F16 (non quantizzata), come nel primo pilota (voce 87)
      flash_attention: true          # come nel primo pilota (voce 87)
      hardware:
        cpu: AMD Ryzen 7 7800X3D 8-Core Processor (8 core, 16 thread)
        gpu: NVIDIA GeForce RTX 4070 12 GB
        ram_gb: 32
        vram_gb: 12
        vram_used: "9,9 GB dedicata + 0,2 GB condivisa con contesto 32768, modello interamente in VRAM (smoke test 2026-10-06)"
configurations:
  P-G: {model: G, output_format: plantuml}
  C-G: {model: G, output_format: compact}
