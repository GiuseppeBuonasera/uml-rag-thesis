# LEVA "NUMERO DI ESEMPI k" (2026-10-08, voce 94): insieme di sviluppo (20 esercizi del corpus, voce 92, leave-one-out),
# MAI il test set. bm25 con k = 2, 3, 5, 8; formati PlantUML e JSON compatto; modelli Gemma 4 12B QAT e
# Qwen2.5-Coder 7B. Anche k = 2 si rigenera: stessi parametri per tutte le condizioni (versione di configurazione 2).
# Regola di scelta di k registrata PRIMA delle run (voce 94) e implementata in experiments/analyze_k.py.
# Una configurazione per volta, un modello caricato alla volta in LM Studio:
#   python experiments/run_experiment.py experiments/configs/dev_k.yaml --configuration P-G
# Totale: 4 k x 2 formati x 2 modelli x 20 esercizi x 2 ripetizioni = 640 generazioni (160 per configurazione).
run_id: dev_k
config_version: 2           # voce 93: contesto 32768, max_tokens 4096 (le run della versione 1 restano 32768 / 12288)
split: corpus
query_ids:   # insieme di sviluppo della voce 92 (experiments/select_dev.py), identico a dev_formats.yaml
  - Boeing
  - OilWells
  - Restaurant
  - EUScienceConnect
  - HomeForTheElderly
  - HelpingHands
  - Bookmaker
  - BusTransportationManagementSystem
  - FitnessCompanyConan
  - Facepage
  - Musicmatic
  - AlphaInsurance
  - ClothingCompany
  - PizzaDeliveryWithEntertainment
  - ProjectManagement
  - HospitalHouseMD
  - InsuranceCompany
  - TruckLogistics
  - Ebike
  - eHome2020
conditions: [bm25]
k: [2, 3, 5, 8]
repetitions: 2
seed: 0
stop_on_reasoning: true
prompt: {serialization: compact, layout: user_only, drop_interactive: true}
generation:
  temperature: 0.3          # valore di lavoro dei piloti (domanda 8 ancora aperta)
  top_p: 0.95
  top_k: 64
  max_tokens: 4096          # versione 2 (voce 93): 3,7 volte la risposta piu' lunga misurata (1.094 token, compatto)
  seed: 42
plantuml_label_rule: auto_v1
models:
  G:
    client:
      kind: lmstudio
      base_url: http://localhost:1234/v1
      model: google/gemma-4-12b-qat
      timeout_s: 1200
      retries: 3
      backoff_s: 2.0
      unsupported_params: []
    model_metadata:
      model_id: google/gemma-4-12b-qat
      quantization: QAT (q4_0)
      context_length: 32768
      lmstudio_version: 0.4.25+1
      enable_thinking: false
      kv_cache_quant: F16            # K e V F16 (non quantizzata), come nel primo pilota (voce 87)
      flash_attention: true          # come nel primo pilota (voce 87)
      hardware:
        cpu: AMD Ryzen 7 7800X3D 8-Core Processor (8 core, 16 thread)
        gpu: NVIDIA GeForce RTX 4070 12 GB
        ram_gb: 32
        vram_gb: 12
        vram_used: "9,9 GB dedicata + 0,2 GB condivisa con contesto 32768, modello interamente in VRAM (smoke test 2026-10-06)"
  Q:                                 # Qwen2.5-Coder 7B Instruct Q6_K (dal 2026-10-07 sera; prima 14B, voce 84)
    client:
      kind: lmstudio
      base_url: http://localhost:1234/v1
      model: qwen2.5-coder-7b-instruct   # id LM Studio (smoke test del 2026-10-07, voce 86); senza editore
      timeout_s: 1200
      retries: 3
      backoff_s: 2.0
      unsupported_params: []
    model_metadata:                  # experiments/configs/qwen25coder7b_template.yaml (voce 85; il 14B non entra
                                     #   in VRAM a 32768, voce 84)
      model_id: qwen2.5-coder-7b-instruct   # l'id esposto da LM Studio non contiene l'editore: la fonte
                                            #   (lmstudio-community, Q6_K) e' nel campo source (voce 86)
      quantization: Q6_K
      source: lmstudio-community/Qwen2.5-Coder-7B-Instruct-GGUF   # confermata dall'utente in My Models (voce 86)
      context_length: 32768
      lmstudio_version: 0.4.25+1
      enable_thinking: false         # il modello NON ha una modalita' di ragionamento
      kv_cache_quant: F16            # nessuna quantizzazione della KV cache
      flash_attention: true
      hardware:
        cpu: AMD Ryzen 7 7800X3D 8-Core Processor (8 core, 16 thread)
        gpu: NVIDIA GeForce RTX 4070 12 GB
        ram_gb: 32
        vram_gb: 12
configurations:
  P-G: {model: G, output_format: plantuml}
  C-G: {model: G, output_format: compact}
  P-Q: {model: Q, output_format: plantuml}
  C-Q: {model: Q, output_format: compact}
