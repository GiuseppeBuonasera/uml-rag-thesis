# MODELLO per le run con LM Studio (Passo 3b, BLOCCATO fino alle risposte dei relatori alle domande 8, 9, 11 e
# alla domanda sull'output strutturato). I segnaposto TODO fanno rifiutare la partenza al runner: vanno
# sostituiti con i valori reali, letti in LM Studio, prima di qualsiasi run.
run_id: TODO_modello_data
split: testset
conditions: [zero_shot, static, random, bm25]
retrieval_source: frozen  # voce 129: esempi da data/retrieval_frozen/retrievals_3b.jsonl (obbligatorio con passo: 3b)
random_seed: per_esercizio_ripetizione  # voce 130: seme di random = f(id esercizio, ripetizione) (obbligatorio con passo: 3b)
k: [3]
repetitions: 1
seed: 0  # con random_seed: per_esercizio_ripetizione la condizione random non lo usa (voce 130)
prompt: {serialization: compact, layout: user_only, drop_interactive: true, example_view: clean_v1}  # voce 139 (obbligatorio con passo: 3b)
client:
  kind: lmstudio
  base_url: http://localhost:1234/v1
  model: TODO            # identificativo del modello come lo espone LM Studio (GET /v1/models)
  timeout_s: 600
  retries: 3
  backoff_s: 2.0
  unsupported_params: []   # parametri di campionamento NON supportati dall'endpoint: non inviati, registrati
generation:                # inviati SEMPRE in modo esplicito: nessuno resta al default del modello
  temperature: 0.0
  top_p: 1.0
  top_k: TODO              # da decidere (domanda 8)
  max_tokens: 8192
  seed: 42
  structured_output: false   # response_format json_schema: DISATTIVATO (domanda ai relatori)
model_metadata:              # obbligatori (con client.model e generation.*): il runner rifiuta un client reale
                             # se uno manca o vale TODO
  model_id: TODO             # es. nome e versione del modello (pagina del modello in LM Studio)
  quantization: TODO         # es. Q4_K_M
  context_length: TODO       # lunghezza di contesto impostata al caricamento in LM Studio
  lmstudio_version: TODO
  enable_thinking: TODO      # true / false, come impostato in LM Studio (impostazione del modello)
  kv_cache_quant: TODO       # quantizzazione della KV cache in LM Studio (es. F16, Q8, Q4)
  flash_attention: TODO      # true / false, come impostato in LM Studio
  hardware:
    cpu: TODO
    gpu: TODO
    ram_gb: TODO
    vram_gb: TODO
