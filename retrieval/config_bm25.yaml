# Configurazione BM25 CONGELATA (Passo 2, STOP 1 approvato il 2026-10-04). Non modificare dopo aver visto il test
# set (FASE 3): una modifica richiede una nuova voce in docs/decisions.md e una nuova analisi LOO.
frozen: true
frozen_date: "2026-10-04"
scelta_su: leave-one-out del corpus (run data/results/retrieval/loo_2026-10-04_stop1), MAI sul test set
motivazione: >-
  valori standard (default di rank_bm25 con preprocessing completo); nessuna delle 48 varianti della griglia e'
  significativamente migliore (differenze appaiate entro 2 errori standard); il preprocessing completo (stopword +
  stemming) e' significativamente migliore delle varianti ridotte (29 configurazioni su 36).

provenienza:
  commit: c161bab3cd2be92ab94ae1ec22187ddd5404d6a7  # HEAD al congelamento; il working tree conteneva il riordino e il codice del Passo 2 non ancora committati
  working_tree_dirty: true
  testset_tag: testset-v1
  testset_tag_commit: eb4d28bebd417d661db642bae06d859963177815

retriever:
  tipo: bm25okapi
  libreria: rank-bm25==0.2.2
  k1: 1.5
  b: 0.75
  epsilon: 0.25  # floor dell'IDF di rank_bm25 (default, non variato)
  campo_indicizzato: description
  candidati: record convertiti di corpus/processed/corpus.jsonl (59)

preprocessing:
  minuscole: true
  token_regex: '[^\W_]+'
  stopwords: true
  stopwords_file: retrieval/stopwords_en.txt
  stopwords_sha256: 5be3f5079be283b4b3c9fae449d5d3a16338d43ac58c82795ecbfdd861671d6d
  stemming: true
  stemmer: snowballstemmer==3.1.1 (english / Porter2)

top_k: 3

# Fasce di score_norm del top-1 per la tassonomia dell'analisi (domanda 12), fissate PRIMA di guardare il test set.
# Terzili della distribuzione LOO dello score_norm del top-1 (59 valori, numpy.percentile lineare a 1/3 e 2/3).
# Intervalli: basso < cutoff_basso_medio <= medio < cutoff_medio_alto <= alto. Non si cambiano dopo la FASE 3.
tassonomia_score_norm_top1:
  metodo: terzili LOO (numpy.percentile, interpolazione lineare)
  cutoff_basso_medio: 0.28929044450335206
  cutoff_medio_alto: 0.3472967055834632
  conteggi_loo: {basso: 20, medio: 19, alto: 20}
